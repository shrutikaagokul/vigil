# VIGIL Configuration
# Override with environment variables: DATABASE_URL, NOTIFICATION_MODE, SNS_TOPIC_ARN

database:
  url: "sqlite:///vigil.db"
  echo: false

rules:
  velocity:
    enabled: true
    window_minutes: 5
    max_transactions: 5
    weight: 1.0

  amount:
    enabled: true
    min_history: 5
    z_low: 3.0
    z_high: 6.0
    cold_start_threshold: 10000.0
    weight: 1.0

  geography:
    enabled: true
    min_distance_km: 50.0
    speed_low_kmh: 800.0
    speed_high_kmh: 1500.0
    weight: 1.0

  duplicate_claim:
    enabled: true
    window_days: 7
    weight: 0.8

scoring:
  low_threshold: 0.30
  medium_threshold: 0.60
  high_threshold: 0.85
  min_individual_score_for_high: 0.5

notification:
  mode: "console"
  sns_topic_arn: ""
  sns_region: "us-east-1"
  alert_tiers:
    - HIGH
    - CRITICAL
  console_url: "http://localhost:5173"
